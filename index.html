<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panificação Alvorada - Gestão ADM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABEÇALHO SUPERIOR -->
  <header class="header-banner">
    <div class="header-title">
      <span class="icon">⚙️</span>
      <h1>Panificação Alvorada - Gestão ADM</h1>
      <span class="badge-status status-publicado" id="status-badge">Publicado</span>
    </div>
    
    <div class="actions-bar">
      <div class="semana-selector">
        <label for="semana-select">📅 Semana:</label>
        <select id="semana-select" onchange="trocarSemana()">
          <option value="Semana 17/08 a 23/08">Semana 17/08 a 23/08</option>
        </select>
      </div>

      <button class="btn btn-green" onclick="alternarStatus()">📣 Publicar / Alternar Status</button>
      <button class="btn btn-blue" onclick="criarNovaSemanaRascunho()">🚀 Nova Semana (Rascunho)</button>
      <button class="btn btn-teal" onclick="abrirModalCriarSetor()">➕ Criar Setor</button>
      <button class="btn btn-indigo" onclick="abrirModalExcel()">📋 Importar do Excel</button>
      <button class="btn btn-red" onclick="excluirSetorAtual()">🗑️ Excluir Setor</button>
      <button class="btn btn-red-dark" onclick="excluirSemanaAtual()">❌ Excluir Semana</button>
      <button class="btn btn-orange" onclick="window.print()">🖨️ Imprimir</button>
    </div>
  </header>

  <!-- ABAS DOS SETORES -->
  <nav class="nav-setores" id="nav-setores-adm">
    <!-- Gerado dinamicamente via JS -->
  </nav>

  <!-- CONTEÚDO DA PROGRAMAÇÃO DO SETOR -->
  <main class="main-content">
    <div class="sector-title-banner" id="titulo-setor-ativo">
      PROGRAMAÇÃO DE PANIFICAÇÃO
    </div>

    <div class="days-grid" id="grid-dias-adm">
      <!-- Cards dos dias gerados via JS -->
    </div>
  </main>

  <!-- MODAL EXCEL COM SELEÇÃO DE DIA -->
  <div id="modal-excel" class="modal-overlay" style="display: none;">
    <div class="modal-card" style="max-width: 550px;">
      <h3>Importar do Excel</h3>
      <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 12px;">
        Selecione o dia e cole os dados copiados de duas colunas do Excel (Ex: Quantidade e Produto).
      </p>

      <div style="margin-bottom: 12px;">
        <label for="select-dia-excel" style="font-size: 0.85rem; font-weight: 600; color: #334155; display: block; margin-bottom: 4px;">
          Selecione o dia da semana:
        </label>
        <select id="select-dia-excel" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-weight: 600;">
          <option value="SEGUNDA">SEGUNDA</option>
          <option value="TERÇA">TERÇA</option>
          <option value="QUARTA">QUARTA</option>
          <option value="QUINTA">QUINTA</option>
          <option value="SEXTA">SEXTA</option>
          <option value="SÁBADO">SÁBADO</option>
          <option value="DOMINGO">DOMINGO</option>
        </select>
      </div>

      <div style="margin-bottom: 12px;">
        <textarea id="excel-input" rows="8" 
          placeholder="Selecione as duas colunas no Excel (Ex: 120 Kg | MASSA DE PIZZA), copie (Ctrl+C) e cole aqui..."
          style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-family: monospace; font-size: 0.8rem; box-sizing: border-box;"></textarea>
      </div>

      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button class="btn btn-danger" onclick="fecharModalExcel()">Cancelar</button>
        <button class="btn btn-green" onclick="processarColagemExcel()">Processar e Inserir</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
