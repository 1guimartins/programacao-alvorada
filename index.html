<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panificação Alvorada - Gestão ADM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>⚙️ Panificação Alvorada - Gestão ADM</h1>
    <div>
      <button onclick="abrirModalExcel()">📋 Importar do Excel</button>
    </div>
  </header>

  <!-- Modal do Excel -->
  <div id="modal-excel" class="modal-overlay">
    <div class="modal-content">
      <h2>Importar do Excel</h2>
      <p>Selecione o dia e cole os dados copiados de duas colunas do Excel (Ex: Quantidade e Produto).</p>
      
      <label for="dia-semana-select">Selecione o dia da semana:</label>
      <select id="dia-semana-select">
        <option value="SEGUNDA">SEGUNDA</option>
        <option value="TERÇA">TERÇA</option>
        <option value="QUARTA">QUARTA</option>
        <option value="QUINTA">QUINTA</option>
        <option value="SEXTA">SEXTA</option>
        <option value="SÁBADO">SÁBADO</option>
        <option value="DOMINGO">DOMINGO</option>
      </select>

      <textarea id="excel-input" placeholder="Selecione as duas colunas no Excel (Ex: 120 Kg | MASSA DE PIZZA), copie (Ctrl+C) e cole aqui..."></textarea>

      <div class="modal-buttons">
        <button type="button" class="btn-modal-cancel" onclick="fecharModalExcel()">Cancelar</button>
        <button type="button" class="btn-modal-confirm" onclick="processarExcel()">Processar e Inserir</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
