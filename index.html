<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - Produção</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header-banner">
    <div class="actions-bar">
      <select id="semana-select" onchange="renderizarQuadro()">
        <!-- Opções geradas via JS -->
      </select>
      <button class="btn btn-blue" onclick="abrirModalExcel()">📋 Colar Excel</button>
      <button class="btn btn-danger" onclick="excluirSetorAtual()">🗑️ Excluir Setor</button>
      <button class="btn btn-green" onclick="alternarStatus()">🚀 Publicar / Sincronizar</button>
    </div>
  </header>

  <nav class="nav-setores" id="nav-setores-adm">
    <!-- Gerado dinamicamente via JS -->
  </nav>

  <main class="main-content">
    <div class="sector-title-banner" id="titulo-setor-ativo">
      PROGRAMAÇÃO DE PANIFICAÇÃO
    </div>

    <div class="days-grid" id="grid-dias-adm">
      <!-- Cards dos dias gerados via JS -->
    </div>
  </main>

  <!-- MODAL EXCEL -->
  <div id="modal-excel" class="modal-overlay" style="display: none;">
    <div class="modal-card" style="max-width: 550px;">
      <h3 style="margin-top: 0;">Importar do Excel</h3>
      <div style="margin-bottom: 12px;">
        <label for="dia-semana-select">Selecione o dia da semana:</label>
        <select id="dia-semana-select" style="width: 100%; padding: 8px; margin-top: 4px;">
          <option value="SEGUNDA">SEGUNDA</option>
          <option value="TERÇA">TERÇA</option>
          <option value="QUARTA">QUARTA</option>
          <option value="QUINTA">QUINTA</option>
          <option value="SEXTA">SEXTA</option>
          <option value="SÁBADO">SÁBADO</option>
          <option value="DOMINGO">DOMINGO</option>
        </select>
      </div>

      <div style="margin-bottom: 12px;">
        <textarea id="excel-input" rows="8" 
          placeholder="Selecione as colunas no Excel (Ex: 120 Kg | MASSA DE PIZZA), copie (Ctrl+C) e cole aqui..." 
          style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-family: monospace; font-size: 0.8rem; box-sizing: border-box;"></textarea>
      </div>

      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button class="btn btn-danger" onclick="fecharModalExcel()">Cancelar</button>
        <button class="btn btn-green" onclick="processarColagemExcel()">Processar e Inserir</button>
      </div>
    </div>
  </div>

  <!-- 1. SDKs do Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- 2. Credenciais do Firebase -->
  <script>
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_PROJETO.firebaseapp.com",
      databaseURL: "https://SEU_PROJETO-default-rtdb.firebaseio.com",
      projectId: "SEU_PROJETO",
      storageBucket: "SEU_PROJETO.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
  </script>

  <!-- 3. Seu script de controle -->
  <script src="script.js?v=3"></script>
</body>
</html>
