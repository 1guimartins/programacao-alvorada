<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panificação Alvorada - Gestão ADM</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <header>
    <h1>⚙️ Gestão ADM <span id="status-badge" class="status-badge bg-rascunho">Rascunho</span></h1>
  </header>

  <div class="semana-container">
    <div class="actions-bar">
      <button class="btn btn-success" onclick="alternarPublicacao()">📢 Publicar para Líderes</button>
      <button class="btn btn-blue" onclick="criarNovaAba()">➕ Criar Setor</button>
      <button class="btn btn-danger" onclick="excluirAbaAtual()">🗑️ Excluir Setor</button>
    </div>
    <button class="btn btn-orange" onclick="window.print()" style="margin-left: auto;">🖨️ Imprimir</button>
  </div>

  <div class="sub-tabs" id="sub-tabs-list"></div>
  <div class="titulo-setor-exibicao" id="setor-titulo">CARREGANDO...</div>
  <div id="setores-containers"></div>

  <script src="script.js"></script>
</body>
</html>
