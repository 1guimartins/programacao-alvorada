<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panificação Alvorada - Gestão ADM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABEÇALHO SUPERIOR -->
  <header class="header-banner">
    <div class="header-title">
      <span class="icon">⚙️</span>
      <h1>Panificação Alvorada - Gestão ADM</h1>
      <span class="status-tag">Publicado</span>
    </div>
  </header>

  <!-- BARRA DE CONTROLES E AÇÕES -->
  <div class="controls-bar">
    <div class="semana-selector">
      <label for="select-semana">🗓️ Semana:</label>
      <select id="select-semana">
        <option value="10/08 a 16/08">Semana 10/08 a 16/08</option>
        <option value="17/08 a 23/08" selected>Semana 17/08 a 23/08</option>
      </select>
    </div>

    <div class="actions-bar">
      <button class="btn btn-green" onclick="alternarStatus()">📣 Publicar / Alternar Status</button>
      <button class="btn btn-blue" onclick="novaSemanaRascunho()">🚀 Nova Semana (Rascunho)</button>
      <button class="btn btn-emerald" onclick="abrirModalCriarSetor()">➕ Criar Setor</button>
      <button class="btn btn-blue" onclick="abrirModalExcel()">📋 Importar do Excel</button>
      <button class="btn btn-danger" onclick="excluirSetor()">🗑️ Excluir Setor</button>
      <button class="btn btn-danger-soft" onclick="excluirSemana()">❌ Excluir Semana</button>
      <button class="btn btn-orange" onclick="window.print()">🖨️ Imprimir</button>
    </div>
  </div>

  <!-- NAVEGAÇÃO DE SETORES (ABAS) -->
  <nav class="nav-setores" id="container-setores">
    <!-- As abas dos setores serão renderizadas via JavaScript -->
  </nav>

  <!-- CONTEÚDO DA PROGRAMAÇÃO DENTRO DO SETOR SELECIONADO -->
  <main class="main-content">
    <div class="sector-title-banner" id="titulo-setor-ativo">
      PROGRAMAÇÃO DE BOLOS SECOS
    </div>

    <div class="days-grid" id="grid-dias">
      <!-- Os cards dos dias (SEGUNDA, TERÇA, QUARTA...) serão gerados pelo JS -->
    </div>
  </main>

  <!-- MODAL: CRIAR NOVO SETOR -->
  <div id="modal-criar-setor" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <h3>➕ Novo Setor</h3>
      <p style="font-size: 0.85rem; color: #64748b;">Digite o nome do novo setor a ser adicionado:</p>
      <input type="text" id="input-nome-setor" placeholder="Ex: PANIFICAÇÃO, SALGADOS..." style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; margin-bottom: 12px;">
      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button class="btn btn-danger" onclick="fecharModalCriarSetor()">Cancelar</button>
        <button class="btn btn-emerald" onclick="confirmarCriarSetor()">Criar Setor</button>
      </div>
    </div>
  </div>

  <!-- MODAL: COLAR DO EXCEL -->
  <div id="modal-excel" class="modal-overlay" style="display: none;">
    <div class="modal-card" style="max-width: 550px;">
      <h3>📋 Importar Dados do Excel</h3>
      <p style="font-size: 0.85rem; color: #64748b; margin-bottom: 12px;">
        Selecione o dia e cole as células copiadas diretamente da sua planilha do Excel no campo abaixo:
      </p>

      <div style="margin-bottom: 10px;">
        <label style="font-weight: 700; font-size: 0.85rem; display: block; margin-bottom: 4px;">Dia da Semana:</label>
        <select id="excel-select-dia" style="padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; width: 100%;">
          <option value="SEGUNDA">SEGUNDA</option>
          <option value="TERÇA">TERÇA</option>
          <option value="QUARTA">QUARTA</option>
          <option value="QUINTA">QUINTA</option>
          <option value="SEXTA">SEXTA</option>
          <option value="SÁBADO">SÁBADO</option>
          <option value="DOMINGO">DOMINGO</option>
        </select>
      </div>

      <div style="margin-bottom: 12px;">
        <label style="font-weight: 700; font-size: 0.85rem; display: block; margin-bottom: 4px;">Cole a Tabela Copiada do Excel (Ctrl+V):</label>
        <textarea 
          id="excel-input-texto" 
          rows="9" 
          placeholder="Selecione as linhas no Excel, copie (Ctrl+C) e cole aqui..." 
          style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; font-family: monospace; font-size: 0.8rem; box-sizing: border-box;"
        ></textarea>
      </div>

      <div style="display: flex; gap: 8px; justify-content: flex-end;">
        <button class="btn btn-danger" onclick="fecharModalExcel()">Cancelar</button>
        <button class="btn btn-green" onclick="processarColagemExcel()">Processar e Inserir</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
