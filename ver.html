<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Setores - Painel dos Líderes</title>
  <link rel="stylesheet" href="lideres-style.css">
</head>
<body>

  <!-- CABEÇALHO SUPERIOR -->
  <header class="header-lideres">
    <div class="header-left">
      <span class="logo-icon">🥐</span>
      <h2>Consulta de Setores</h2>
    </div>
    <div class="header-right">
      <button class="btn-top btn-hist" onclick="verHistorico()">🔔 Histórico</button>
      <button class="btn-top btn-print" onclick="window.print()">🖨️ Imprimir</button>
    </div>
  </header>

  <!-- ABAS DOS SETORES -->
  <nav class="nav-setores-lideres" id="nav-setores-lideres">
    <!-- Gerado dinamicamente via JS -->
  </nav>

  <!-- CONTEÚDO DA PROGRAMAÇÃO DO SETOR -->
  <main class="main-lideres">
    <div class="sector-title-banner" id="titulo-setor-ativo">
      PROGRAMAÇÃO DE PANIFICAÇÃO
    </div>

    <div class="days-grid-lideres" id="grid-dias-lideres">
      <!-- Cards dos dias gerados via JS -->
    </div>
  </main>

  <script src="lideres-script.js"></script>
</body>
</html>
