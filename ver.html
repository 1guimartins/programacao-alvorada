<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Setores - Líderes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header-banner">
    <div class="actions-bar">
      <button class="btn btn-orange" onclick="window.print()">🖨️ Imprimir</button>
    </div>
  </header>

  <!-- ABAS DOS SETORES -->
  <nav class="nav-setores" id="nav-setores-lideres">
    <!-- Gerado dinamicamente via JS -->
  </nav>

  <!-- CONTEÚDO DA PROGRAMAÇÃO DO SETOR -->
  <main class="main-content">
    <div class="sector-title-banner" id="titulo-setor-ativo">
      PROGRAMAÇÃO DE PANIFICAÇÃO
    </div>

    <div class="days-grid" id="grid-dias-lideres">
      <!-- Cards dos dias gerados via JS -->
    </div>
  </main>

  <!-- 1. SDKs do Firebase (ESSENCIAIS para sincronizar no celular) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- 2. Credenciais do Firebase -->
  <script>
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_PROJETO.firebaseapp.com",
      databaseURL: "https://SEU_PROJETO-default-rtdb.firebaseio.com",
      projectId: "SEU_PROJETO",
      storageBucket: "SEU_PROJETO.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
  </script>

  <!-- 3. Seu script de controle -->
  <script src="view-script.js?v=3"></script>
</body>
</html>
