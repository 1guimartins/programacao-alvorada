<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panificação Alvorada - Consulta de Setores</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <header>
    <h1>🥐 Panificação Alvorada - Consulta de Setores</h1>
  </header>

  <div class="semana-container">
    <div class="semana-seletor">
      📅 Selecionar Semana:
      <select id="seletor-semana-view" onchange="mudarSemanaView(this.value)"></select>
    </div>
    <button class="btn btn-orange" onclick="window.print()" style="margin-left: auto;">🖨️ Imprimir</button>
  </div>

  <div id="banner-alerta-lider" class="alerta-atualizacao" style="display: none;">
    <span>🔔 <strong>Atenção Líder!</strong> Há atualizações recentes do ADM na programação do seu setor.</span>
    <button class="btn btn-blue" onclick="limparNotificacoesSetor()">Entendi / Marcar Lido</button>
  </div>

  <div class="sub-tabs" id="sub-tabs-list-view"></div>
  <div class="titulo-setor-exibicao" id="setor-titulo-view">CARREGANDO...</div>
  <div id="setores-containers-view"></div>

  <script src="view-script.js"></script>
</body>
</html>
