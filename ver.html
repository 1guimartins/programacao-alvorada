<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panificação Alvorada - Consulta</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <header>
    <h1>🥐 Consulta de Setores</h1>
    <button class="sininho-btn" onclick="abrirModal()">🔔 Histórico</button>
  </header>

  <div class="semana-container">
    <button class="btn btn-orange" onclick="window.print()" style="margin-left: auto;">🖨️ Imprimir</button>
  </div>

  <div class="sub-tabs" id="sub-tabs-list-view"></div>
  <div class="titulo-setor-exibicao" id="setor-titulo-view">CARREGANDO...</div>
  <div id="setores-containers-view"></div>

  <div id="modal-notificacoes" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3>📋 Histórico de Alterações</h3>
        <button onclick="fecharModal()" style="border:none; background:none; font-size:1.2rem; cursor:pointer;">&times;</button>
      </div>
      <div id="modal-lista">
        <p class="item-vazio">Sem historico recente.</p>
      </div>
    </div>
  </div>

  <script src="view-script.js"></script>
</body>
</html>
