<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panificação Alvorada - Consulta de Setores</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <header>
    <h1>🥐 Panificação Alvorada - Consulta</h1>
    
    <div class="sininho-container" onclick="abrirModalHistorico()">
      <span class="sininho-icon">🔔</span>
      <span id="sininho-contador" class="sininho-badge" style="display: none;">0</span>
    </div>
  </header>

  <div class="semana-container">
    <div class="semana-seletor">
      📅 Selecionar Semana:
      <select id="seletor-semana-view" onchange="mudarSemanaView(this.value)"></select>
    </div>
    <button class="btn btn-orange" onclick="window.print()" style="margin-left: auto;">🖨️ Imprimir</button>
  </div>

  <div class="sub-tabs" id="sub-tabs-list-view"></div>
  <div class="titulo-setor-exibicao" id="setor-titulo-view">CARREGANDO...</div>
  <div id="setores-containers-view"></div>

  <div id="modal-historico" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📋 Histórico de Atualizações do ADM</h3>
        <button class="modal-close" onclick="fecharModalHistorico()">&times;</button>
      </div>
      <div id="modal-body-historico" class="modal-body">
        <p class="item-vazio">Nenhuma atualização gravada nesta semana.</p>
      </div>
    </div>
  </div>

  <script src="view-script.js"></script>
</body>
</html>
