<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Setores - Panificação Alvorada</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CABEÇALHO SUPERIOR -->
  <header class="header-banner">
    <div class="header-title">
      <span class="icon">🥐</span>
      <h1>Consulta de Setores</h1>
    </div>
    <div class="actions-bar" style="margin-left: auto;">
      <button class="btn btn-orange" onclick="verHistorico()">🔔 Histórico</button>
      <button class="btn btn-orange" onclick="window.print()">🖨️ Imprimir</button>
    </div>
  </header>

  <!-- ABAS DOS SETORES -->
  <nav class="nav-setores" id="nav-setores-lideres">
    <!-- Gerado dinamicamente via JS -->
  </nav>

  <!-- CONTEÚDO DA PROGRAMAÇÃO DO SETOR -->
  <main class="main-content">
    <div class="sector-title-banner" id="titulo-setor-ativo">
      PROGRAMAÇÃO DE PANIFICAÇÃO
    </div>

    <div class="days-grid" id="grid-dias-lideres">
      <!-- Cards dos dias gerados via JS -->
    </div>
  </main>

  <script src="view-script.js"></script>
</body>
</html>
