<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panificação Alvorada - Líderes</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <header class="header-bar">
    <h1>🥐 Panificação Alvorada - Visão dos Líderes</h1>
  </header>

  <div class="container">

    <div class="historico-container">
      <label for="seletor-semana-view"><strong>🔍 Consultar Histórico Semanal:</strong></label>
      <input type="week" id="seletor-semana-view" onchange="carregarHistoricoView(this.value)">
      <span class="historico-info" id="info-semana-view">Semana Atual</span>
    </div>

    <div class="sub-tabs-container" id="sub-tabs-list-view"></div>

    <div class="programacao-header-title" id="setor-titulo-view">
      CARREGANDO PROGRAMAÇÃO...
    </div>

    <div id="setores-containers-view"></div>
  </div>

  <script src="view-script.js"></script>
</body>
</html>
