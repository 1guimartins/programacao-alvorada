<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panificação Alvorada - Consulta de Programação</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { background-color: #f4f6f9; }
    .header-bar { text-align: center; background-color: #0f5c2e; padding: 15px; color: white; }
    .container-view { max-width: 900px; margin: 15px auto; padding: 10px; }
    .view-card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .sub-tabs-view { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
    .sub-tab-btn-view { padding: 8px 14px; border: none; background: #e0e0e0; border-radius: 4px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .sub-tab-btn-view.active { background: #0066cc; color: white; }
  </style>
</head>
<body>

  <header class="header-bar">
    <h1>🥐 Panificação Alvorada - Consulta de Programação</h1>
  </header>

  <div class="container-view">
    <div class="view-card">
      <div class="sub-tabs-view" id="sub-tabs-list-view"></div>

      <div class="programacao-header-title" id="setor-titulo-view" style="background-color: #0066cc; color: white; text-align: center; padding: 10px; font-weight: bold; font-size: 1.2rem; border-radius: 4px; margin-bottom: 15px;">
        SELECIONE UMA ABA
      </div>

      <div id="setores-containers-view">
        <p style="text-align: center; color: #666; margin: 30px 0;">Nenhuma programação publicada pelo ADM ainda.</p>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script src="view-script.js"></script>
</body>
</html>
